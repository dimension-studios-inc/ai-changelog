name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - develop
  workflow_dispatch:

# A new push to a PR makes the in-flight run obsolete; don't pay for it twice.
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    # Draft PRs: skip until ready_for_review (still in `on.pull_request.types`).
    # workflow_dispatch has no pull_request payload, so draft is empty/falsy and this runs.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Reject pull requests targeting main
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
        run: |
          echo "::error::PRs targeting main are not allowed. Open the PR against develop, then run the Promote workflow."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run biome check
        run: bun run check

      - name: Run type check
        run: bun run type-check

      - name: Run knip
        run: bun run knip

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
