name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Release runs once Check passes on main.
  push:
    branches:
      - main
  workflow_dispatch:

# A new push to a PR makes the in-flight run obsolete; don't pay for it twice. Runs on main are
# never cancelled, so each merge gets its answer.
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: Check
    # Draft PRs: skip until ready_for_review (still in `on.pull_request.types`).
    # workflow_dispatch has no pull_request payload, so draft is empty/falsy and this runs.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          # packageManager in package.json pins the bun version.
          bun-version-file: package.json

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run type-check
      - run: bun run knip
      - run: bun run test
      - run: bun run build
