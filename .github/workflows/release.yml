name: Release

on:
  push:
    branches:
      - main
      - main-release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}
      - name: Setup Git Config
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github-actions@example.com"
      - name: Sync Branch
        run: |
          set -euo pipefail
          SOURCE="${GITHUB_REF_NAME}"
          TARGET="${GITHUB_REF_NAME}-release"

          git fetch origin "$TARGET:$TARGET"
          git fetch origin "$SOURCE"

          git checkout "$TARGET"
          if ! git merge "origin/$SOURCE" --strategy=recursive -X theirs --no-edit; then
            # -X theirs does not resolve modify/delete (e.g. package-lock.json
            # removed on main after the pnpm migration).
            while IFS= read -r file; do
              if git cat-file -e "origin/${SOURCE}:${file}" 2>/dev/null; then
                git checkout --theirs -- "$file"
                git add -- "$file"
              else
                git rm -f -- "$file"
              fi
            done < <(git diff --name-only --diff-filter=U)
            git commit --no-edit
          fi
          git push origin "$TARGET"

  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    if: github.ref == 'refs/heads/main-release'
    steps:
      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}
      - name: Setup pnpm
        uses: pnpm/setup@v2.0.2
        with:
          runtime: node@24.19.0
          cache: true
          install: false
      # @semantic-release/npm publishes with npm. Trusted publishing (OIDC)
      # needs setup-node's registry-url; pnpm/setup does not configure that.
      - name: Setup npm registry
        uses: actions/setup-node@v6.1.0
        with:
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          AI_CHANGELOG_DISCORD_WEBHOOK: ${{ secrets.AI_CHANGELOG_DISCORD_WEBHOOK }}
          AI_CHANGELOG_SLACK_WEBHOOK: ${{ secrets.AI_CHANGELOG_SLACK_WEBHOOK }}
        run: pnpm release
