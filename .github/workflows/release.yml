name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # npm trusted publishing via OIDC (no NPM_TOKEN)
    steps:
      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}
      - name: Setup pnpm
        uses: pnpm/setup@v2.0.2
        with:
          # packageManager in package.json pins the pnpm version.
          install: false
          cache: true
      # Official Node+npm on PATH for @semantic-release/npm OIDC publish.
      # Do not set registry-url: it writes an empty _authToken and breaks trusted publishing.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.20.0"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          AI_CHANGELOG_DISCORD_WEBHOOK: ${{ secrets.AI_CHANGELOG_DISCORD_WEBHOOK }}
          AI_CHANGELOG_SLACK_WEBHOOK: ${{ secrets.AI_CHANGELOG_SLACK_WEBHOOK }}
        run: pnpm exec semantic-release

  sync:
    name: Sync
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}
      - name: Setup Git Config
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github-actions@example.com"
      - name: Sync version and changelog to develop
        run: |
          set -euo pipefail
          git fetch origin main develop
          git checkout develop
          git checkout origin/main -- CHANGELOG.md package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "develop already matches main version and changelog"
            exit 0
          fi
          git commit -m "chore(release): sync version and changelog from main"
          git push origin develop
