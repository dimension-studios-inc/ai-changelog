name: "Setup Bun"
description: "Node from .nvmrc and bun from packageManager"
runs:
  using: "composite"
  steps:
    # The tools CI runs (biome, tsc, vitest, knip, semantic-release…) start through Node shebangs.
    - name: Setup Node.js
      uses: actions/setup-node@v7.0.0
      with:
        node-version-file: .nvmrc

    - name: Setup bun
      uses: oven-sh/setup-bun@v2.2.0
      with:
        # packageManager in package.json pins the bun version.
        bun-version-file: package.json
